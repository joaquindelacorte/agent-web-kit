<!DOCTYPE html>

<link rel="stylesheet" href="../../styles.css">
<style>
/* ── Landing-specific styles ── */
.hero-landing {
  max-width: 900px; margin: 0 auto;
  padding: 6rem 2rem 4rem;
  text-align: center;
}
.agent-avatar {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 1.5rem;
  background: linear-gradient(135deg, var(--accent), var(--green));
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 800; color: #fff;
  font-family: var(--mono);
  box-shadow: 0 0 40px var(--accent-glow);
}
.hero-landing h1 { font-size: clamp(2rem,5vw,3.2rem); margin-bottom: .75rem; }
.hero-landing .lead { font-size: 1.1rem; color: var(--soft); margin-bottom: 2rem; max-width: 560px; margin-left: auto; margin-right: auto; }
.hero-landing .hero-meta { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2.5rem; }

/* Capabilities */
.cap-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem;
  transition: border-color .2s, box-shadow .2s;
}
.cap-card:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
.cap-icon { font-size: 1.5rem; margin-bottom: .75rem; }
.cap-card h3 { margin-bottom: .4rem; }
.cap-card p { font-size: .875rem; }

/* Examples */
.example-block {
  background: #080a0e; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
}
.example-prompt {
  font-family: var(--mono); font-size: .8rem;
  color: var(--accent-mid); margin-bottom: .5rem;
}
.example-prompt::before { content: '> '; color: var(--muted); }
.example-response { font-size: .875rem; color: var(--soft); }

/* FAQ */
.faq-item { border-bottom: 1px solid var(--border); padding: 1.25rem 0; cursor: pointer; }
.faq-item:last-child { border-bottom: none; }
.faq-q { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.faq-arrow { color: var(--muted); transition: transform .2s; font-family: var(--mono); }
.faq-item.open .faq-arrow { transform: rotate(90deg); }
.faq-a { display: none; color: var(--soft); font-size: .9rem; margin-top: .75rem; }
.faq-item.open .faq-a { display: block; }

/* CTA */
.cta-band {
  background: linear-gradient(135deg, rgba(99,102,241,.12), rgba(34,211,165,.06));
  border: 1px solid rgba(99,102,241,.2);
  border-radius: var(--radius); padding: 3rem 2rem;
  text-align: center; margin: 0 2rem;
}
</style>
</head>
